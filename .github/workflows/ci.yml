name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Releases can also be started from the Actions tab (or API) with a version such as v0.1.0.
  workflow_dispatch:
    inputs:
      version:
        description: Release version (tag to create), e.g. v0.1.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew -PwithApp :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hwpbyhwp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD are required to sign a release."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew -PwithApp :app:assembleRelease
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "hwpbyhwp-${VERSION}.apk"
          # From a dispatch the tag does not exist yet; gh creates it on the built commit.
          gh release create "$VERSION" "hwpbyhwp-${VERSION}.apk" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
